<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111a2e"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
    <marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fb923c"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f87171"/></marker>
    <marker id="aC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22d3ee"/></marker>
    <marker id="aV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>

  <rect width="1200" height="830" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="830" rx="24" fill="url(#grid)"/>

  <text x="48" y="58" font-size="26" font-weight="700" fill="#f1f5f9">monitoring-stack</text>
  <text x="280" y="58" font-size="18" fill="#94a3b8">· métriques, logs et alertes</text>
  <g transform="translate(880,34)">
    <rect width="272" height="32" rx="16" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.5"/>
    <circle cx="20" cy="16" r="5" fill="#34d399"/>
    <text x="34" y="21" font-size="14" fill="#a7f3d0">7 conteneurs · Docker Compose</text>
  </g>

  <!-- GITHUB -->
  <rect x="40" y="90" width="1120" height="160" rx="18" fill="#a78bfa" fill-opacity="0.06" stroke="#a78bfa" stroke-opacity="0.45" stroke-dasharray="6 6"/>
  <text x="64" y="120" font-size="15" font-weight="700" fill="#c4b5fd" letter-spacing="1.5">GITHUB</text>
  <text x="138" y="120" font-size="14" fill="#94a3b8">CI « Validation de la stack » à chaque Pull Request</text>

  <rect x="64" y="142" width="150" height="84" rx="12" fill="#1e1b3a" stroke="#a78bfa" stroke-opacity="0.7"/>
  <text x="84" y="178" font-size="16" font-weight="700" fill="#f1f5f9">Pull Request</text>
  <text x="84" y="200" font-size="13" fill="#a5b4fc">branche → main</text>
  <path d="M216 184H246" stroke="#a78bfa" stroke-width="2.4" marker-end="url(#aV)"/>

  <rect x="250" y="138" width="686" height="92" rx="14" fill="#0e2a33" stroke="#22d3ee" stroke-opacity="0.55"/>
  <g font-size="13" font-family="Consolas, Menlo, monospace" fill="#a5f3fc">
    <rect x="268" y="152" width="96" height="28" rx="8" fill="#12343f"/><text x="282" y="171">yamllint</text>
    <rect x="372" y="152" width="138" height="28" rx="8" fill="#12343f"/><text x="384" y="171">compose config</text>
    <rect x="518" y="152" width="122" height="28" rx="8" fill="#12343f"/><text x="530" y="171">json.tool</text>
    <rect x="648" y="152" width="140" height="28" rx="8" fill="#12343f"/><text x="660" y="171">promtool check</text>
    <rect x="796" y="152" width="124" height="28" rx="8" fill="#12343f"/><text x="808" y="171">amtool</text>
    <rect x="268" y="188" width="226" height="28" rx="8" fill="#22d3ee" fill-opacity="0.2" stroke="#22d3ee" stroke-opacity="0.7"/><text x="280" y="207" fill="#ecfeff" font-weight="700">promtool test rules</text>
    <rect x="502" y="188" width="170" height="28" rx="8" fill="#12343f"/><text x="514" y="207">loki -verify</text>
    <rect x="680" y="188" width="120" height="28" rx="8" fill="#12343f"/><text x="692" y="207">alloy fmt</text>
  </g>
  <text x="812" y="207" font-size="12" fill="#94a3b8">mêmes images</text>
  <path d="M938 184H968" stroke="#34d399" stroke-width="2.4" marker-end="url(#aG)"/>
  <rect x="972" y="142" width="164" height="84" rx="12" fill="#0f2e25" stroke="#34d399" stroke-opacity="0.75"/>
  <text x="992" y="178" font-size="16" font-weight="700" fill="#f1f5f9">main protégée</text>
  <text x="992" y="200" font-size="13" fill="#a7f3d0">fusion si CI verte</text>

  <!-- NAVIGATEUR -->
  <rect x="40" y="300" width="166" height="250" rx="16" fill="#132036" stroke="#60a5fa" stroke-opacity="0.6"/>
  <g transform="translate(62,322)" stroke="#93c5fd" stroke-width="2" fill="none">
    <rect x="0" y="0" width="36" height="24" rx="3"/><path d="M10 30h16M18 24v6"/>
  </g>
  <text x="62" y="378" font-size="16" font-weight="700" fill="#f1f5f9">PC Windows</text>
  <text x="62" y="398" font-size="13" fill="#93c5fd">navigateur</text>
  <g font-size="13" font-family="Consolas, Menlo, monospace" fill="#e2e8f0">
    <text x="62" y="430">:3000 Grafana</text>
    <text x="62" y="454">:9090 Prometheus</text>
    <text x="62" y="478">:9093 Alertmanager</text>
    <text x="62" y="502">:12345 Alloy</text>
  </g>
  <text x="62" y="530" font-size="12" fill="#94a3b8">seuls ports publiés</text>
  <path d="M208 425H234" stroke="#60a5fa" stroke-width="2.4" marker-end="url(#a)"/>

  <!-- LAB-SRV -->
  <rect x="236" y="276" width="924" height="520" rx="18" fill="#60a5fa" fill-opacity="0.05" stroke="#60a5fa" stroke-opacity="0.45" stroke-dasharray="6 6"/>
  <text x="260" y="306" font-size="15" font-weight="700" fill="#93c5fd" letter-spacing="1.5">LAB-SRV</text>
  <text x="1136" y="306" font-size="14" fill="#94a3b8" text-anchor="end">Debian 13 · réseau Docker « monitoring_default »</text>

  <!-- colonne 1 -->
  <g filter="url(#sh)">
    <rect x="262" y="336" width="210" height="88" rx="14" fill="#2a1f12" stroke="#fb923c" stroke-opacity="0.75"/>
    <rect x="262" y="452" width="210" height="88" rx="14" fill="#2a1f12" stroke="#fb923c" stroke-opacity="0.75"/>
    <rect x="262" y="640" width="210" height="88" rx="14" fill="#1b2b47" stroke="#94a3b8" stroke-opacity="0.6"/>
  </g>
  <text x="280" y="366" font-size="16" font-weight="700" fill="#f1f5f9">node-exporter</text>
  <text x="280" y="387" font-size="13" fill="#fed7aa">CPU, RAM, disque, réseau</text>
  <text x="280" y="408" font-size="12" font-family="Consolas, Menlo, monospace" fill="#94a3b8">réseau hôte · :9100</text>
  <text x="280" y="482" font-size="16" font-weight="700" fill="#f1f5f9">cAdvisor</text>
  <text x="280" y="503" font-size="13" fill="#fed7aa">chaque conteneur</text>
  <text x="280" y="524" font-size="12" font-family="Consolas, Menlo, monospace" fill="#94a3b8">interne · :8080</text>
  <text x="280" y="670" font-size="16" font-weight="700" fill="#f1f5f9">Docker</text>
  <text x="280" y="691" font-size="13" fill="#cbd5e1">logs stdout / stderr</text>
  <text x="280" y="712" font-size="12" font-family="Consolas, Menlo, monospace" fill="#94a3b8">docker.sock</text>

  <!-- colonne 2 -->
  <g filter="url(#sh)">
    <rect x="556" y="356" width="226" height="130" rx="14" fill="#3a1717" stroke="#f87171" stroke-opacity="0.8"/>
    <rect x="556" y="586" width="226" height="74" rx="14" fill="#123030" stroke="#22d3ee" stroke-opacity="0.7"/>
    <rect x="556" y="694" width="226" height="74" rx="14" fill="#123030" stroke="#22d3ee" stroke-opacity="0.7"/>
  </g>
  <text x="576" y="388" font-size="18" font-weight="700" fill="#f1f5f9">Prometheus</text>
  <text x="576" y="410" font-size="13" fill="#fecaca">collecte (pull) toutes les 15 s</text>
  <text x="576" y="430" font-size="13" fill="#fecaca">stocke 15 jours · 3 règles</text>
  <text x="576" y="462" font-size="12" font-family="Consolas, Menlo, monospace" fill="#94a3b8">+ Alertmanager, Loki, Alloy</text>
  <text x="576" y="477" font-size="12" font-family="Consolas, Menlo, monospace" fill="#94a3b8">6 cibles au total</text>
  <text x="576" y="616" font-size="16" font-weight="700" fill="#f1f5f9">Alloy</text>
  <text x="576" y="638" font-size="13" fill="#a5f3fc">agent : découvre et étiquette</text>
  <text x="576" y="724" font-size="16" font-weight="700" fill="#f1f5f9">Loki</text>
  <text x="576" y="746" font-size="13" fill="#a5f3fc">logs indexés par labels · 7 j</text>

  <!-- colonne 3 -->
  <g filter="url(#sh)">
    <rect x="872" y="336" width="262" height="86" rx="14" fill="#3a1717" stroke="#f87171" stroke-opacity="0.8"/>
    <rect x="872" y="560" width="262" height="130" rx="14" fill="#2b1f45" stroke="#c084fc" stroke-opacity="0.8"/>
  </g>
  <text x="892" y="366" font-size="17" font-weight="700" fill="#f1f5f9">Alertmanager</text>
  <text x="892" y="387" font-size="13" fill="#fecaca">regroupe, inhibe, route</text>
  <text x="892" y="406" font-size="12" font-family="Consolas, Menlo, monospace" fill="#94a3b8">critical → coupe les warning</text>
  <rect x="900" y="450" width="206" height="30" rx="15" fill="#f87171" fill-opacity="0.12" stroke="#f87171" stroke-opacity="0.6"/>
  <text x="1003" y="470" font-size="13" fill="#fecaca" text-anchor="middle">canal au choix (Discord, mail…)</text>
  <path d="M1003 424V446" stroke="#f87171" stroke-width="2.2" marker-end="url(#aR)"/>

  <text x="892" y="592" font-size="18" font-weight="700" fill="#f1f5f9">Grafana</text>
  <text x="892" y="614" font-size="13" fill="#e9d5ff">provisionné en code</text>
  <text x="892" y="634" font-size="13" fill="#e9d5ff">sources + dashboard JSON</text>
  <text x="892" y="668" font-size="12" font-family="Consolas, Menlo, monospace" fill="#94a3b8">Explore : PromQL et LogQL</text>

  <!-- flux -->
  <path d="M474 380C512 380 520 404 552 404" fill="none" stroke="#fb923c" stroke-width="2.2" marker-end="url(#aO)"/>
  <path d="M474 496C512 496 520 446 552 446" fill="none" stroke="#fb923c" stroke-width="2.2" marker-end="url(#aO)"/>
  <text x="482" y="444" font-size="12" fill="#fdba74">scrape</text>
  <text x="482" y="458" font-size="12" fill="#fdba74">/metrics</text>

  <path d="M474 684C512 684 516 623 552 623" fill="none" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="484" y="640" font-size="12" fill="#cbd5e1">lecture</text>

  <path d="M669 662V690" stroke="#22d3ee" stroke-width="2.4" marker-end="url(#aC)"/>
  <text x="680" y="681" font-size="12" fill="#a5f3fc">push</text>

  <path d="M784 384C826 384 830 370 868 370" fill="none" stroke="#f87171" stroke-width="2.4" marker-end="url(#aR)"/>
  <text x="796" y="364" font-size="12" fill="#fecaca">alertes</text>

  <path d="M784 456C840 456 830 600 868 600" fill="none" stroke="#c084fc" stroke-width="2.2" marker-end="url(#aV)"/>
  <text x="806" y="528" font-size="12" fill="#e9d5ff">PromQL</text>
  <path d="M784 731C840 731 830 656 868 656" fill="none" stroke="#c084fc" stroke-width="2.2" marker-end="url(#aV)"/>
  <text x="806" y="714" font-size="12" fill="#e9d5ff">LogQL</text>
</svg>
